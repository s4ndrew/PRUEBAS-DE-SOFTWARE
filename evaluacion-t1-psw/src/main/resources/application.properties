spring.application.name=modeloT1PSW

# ===== Base de datos H2 en memoria (no requiere instalar nada) =====
# Se crea al iniciar la aplicación y se borra al detenerla.
spring.datasource.url=jdbc:h2:mem:matricula;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# ===== Alternativa MySQL (solo si ya la tienes instalada) =====
# spring.datasource.url=jdbc:mysql://localhost:3306/bdmatricula
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=mysql
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
